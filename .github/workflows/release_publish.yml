name: "Release: Publish"
run-name: "Release: ${{ github.event.head_commit.message || inputs.tag }}"

on:
  push:
    branches:
      - mainline
    paths:
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: Specify a tag to re-run a release.

concurrency:
  group: release

permissions:
  contents: read

jobs:
  TagRelease:
    # SUBSTITUTION: local copy; GITHUB_TOKEN pushes the tag, so the job needs contents: write.
    uses: ./.github/workflows/reusable_tag_release.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

  UnitTests:
    name: Unit Tests
    needs: TagRelease
    uses: ./.github/workflows/code_quality.yml
    with:
      tag: ${{ needs.TagRelease.outputs.tag }}

  PreRelease:
      needs: [TagRelease, UnitTests]
      # SUBSTITUTION: local copy, no inherited secrets.
      uses: ./.github/workflows/reusable_prerelease.yml
      permissions:
        id-token: write
        contents: write
      with:
          tag: ${{ needs.TagRelease.outputs.tag }}

  Release:
      needs: [TagRelease, PreRelease]
      # SUBSTITUTION: local copy (signing is a no-op), no inherited secrets.
      uses: ./.github/workflows/reusable_release.yml
      permissions:
        id-token: write
        contents: write
      with:
          tag: ${{ needs.TagRelease.outputs.tag }}

  Publish:
    needs: [TagRelease, Release]
    # SUBSTITUTION: local copy (the CodeArtifact publish is a no-op), no inherited secrets.
    uses: ./.github/workflows/reusable_publish_python.yml
    permissions:
      contents: read
    with:
        tag: ${{ needs.TagRelease.outputs.tag }}

  # PyPI does not support reusable workflows yet
  # # See https://github.com/pypi/warehouse/issues/11096
  PublishToPyPI:
    needs: [TagRelease, Publish]
    # SUBSTITUTION: ubuntu-24.04, since ubuntu-latest (26.04) has no Python 3.9 for setup-python.
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.TagRelease.outputs.tag }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install --upgrade hatch "virtualenv<21"
      - name: Build
        run: hatch -v build
      # # See https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-pypi
      # SUBSTITUTION: no PyPI upload; prints what would have been uploaded.
      - name: Publish to PyPI
        run: |
          echo "no-op: would upload to PyPI:"
          ls -l dist
