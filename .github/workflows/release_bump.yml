name: "Release: Bump"

on:
  workflow_dispatch:
    inputs:
      force_version_bump:
        required: false
        default: ""
        type: choice
        options:
        - ""
        - patch
        - minor
        - major

concurrency:
  group: release

jobs:
  Bump:
    name: Version Bump
    # SUBSTITUTION: the local copy of OpenJobDescription/.github's reusable_bump.yml (see README).
    uses: ./.github/workflows/reusable_bump.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      force_version_bump: ${{ inputs.force_version_bump }}