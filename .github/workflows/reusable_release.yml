name: "Github Release"

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string


jobs:
  Release:
    # SUBSTITUTION: ubuntu-24.04, since ubuntu-latest (26.04) has no Python 3.9 for setup-python.
    runs-on: ubuntu-24.04
    name: Release
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{inputs.tag}}
          fetch-depth: 0
          # SUBSTITUTION: GITHUB_TOKEN instead of CI_TOKEN.
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'

      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        
      # SUBSTITUTION: no AWS credentials, no PGP key, no signing; prints what would have been signed.
      - name: Sign
        run: |
          shopt -s nullglob
          for file in build-artifact/dist/* build-artifact/dist_extras/*; do
             echo "no-op: would create the detached PGP signature $file.sig"
          done
          shopt -u nullglob

      - name: PushRelease
        env:
          # SUBSTITUTION: GITHUB_TOKEN instead of CI_TOKEN (a GitHub Release in this repo only).
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          RELEASE_NOTES=$(python .github/scripts/get_latest_changelog.py)

          shopt -s nullglob
          gh release create "$TAG" build-artifact/dist/* build-artifact/dist_extras/* --notes "$RELEASE_NOTES"


 