name: "Publish Python Package"

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        
jobs:
  PublishToCodeArtifact:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # SUBSTITUTION: no AWS credentials and no CodeBuild publish; prints what would have run.
      - name: Run CodeBuild
        env:
          TAG: ${{ inputs.tag }}
          PROJECT: ${{ github.event.repository.name }}-release-Publish
        run: |
          echo "no-op: would run CodeBuild project $PROJECT at refs/tags/$TAG"
