# .github/workflows/reusable_tag_and_check.yml
name: "Tag and Check Release"

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        description: "Existing tag to use (optional)"
    outputs:
      tag:
        description: "The validated tag"
        value: ${{ jobs.TagRelease.outputs.tag }}

jobs:
  TagRelease:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.tag-release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          # SUBSTITUTION: GITHUB_TOKEN instead of CI_TOKEN.
          token: ${{ github.token }}
          
      - name: Tag Release
        id: tag-release
        # SUBSTITUTION: this repo's copy of the action (@mainline, as upstream names its own); the bot identity instead of the EMAIL and USER secrets.
        uses: seant-aws/rt-release-sim/.github/actions/tag-release@mainline
        with:
          tag: ${{ inputs.tag || '' }}
          email: "41898282+github-actions[bot]@users.noreply.github.com"
          username: "github-actions[bot]"
          
      - name: Check Release
        # SUBSTITUTION: this repo's copy of the action (@mainline, as upstream names its own); the bot identity instead of the EMAIL secret.
        uses: seant-aws/rt-release-sim/.github/actions/check-release@mainline
        with:
          tag: ${{ steps.tag-release.outputs.tag }}
          expected_author: "41898282+github-actions[bot]@users.noreply.github.com"
          